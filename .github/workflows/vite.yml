name: Build project

on:
  pull_request:
  push:

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
      - name: Install dependencies
        run: npm ci
      - name: Build project
        run: npm run build
